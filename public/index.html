<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>br_validators: teste os validadores</title>
    <meta
      name="description"
      content="Teste no navegador a gem Ruby br_validators: CPF, CNPJ alfanumérico, CNS, chave Pix e boleto."
    />
    <!-- O site também abre em br-validators-gem.vercel.app; o canonical diz qual é o principal. -->
    <link rel="canonical" href="https://br-validators.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://br-validators.vercel.app/" />
    <meta property="og:title" content="br_validators: teste os validadores" />
    <meta
      property="og:description"
      content="Teste no navegador a gem Ruby br_validators: CPF, CNPJ alfanumérico, CNS, chave Pix e boleto."
    />
    <!-- Cor da barra do navegador no celular, igual ao fundo da página em cada tema. -->
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.mjs"></script>
  </head>
  <body>
    <header>
      <h1>br_validators</h1>
      <p>
        Teste os validadores da gem Ruby no navegador. Quem valida é a própria gem, rodando numa função Ruby; nada do
        que você digita é guardado.
      </p>
    </header>

    <main>
      <form id="formulario">
        <label for="documento">Documento</label>
        <select id="documento" name="documento">
          <option value="cpf">CPF</option>
          <option value="cnpj">CNPJ (numérico ou alfanumérico)</option>
          <option value="cns">CNS (Cartão Nacional de Saúde)</option>
          <option value="pix">Chave Pix</option>
          <option value="boleto">Linha digitável de boleto</option>
        </select>

        <!--
          autocapitalize/autocorrect desligados: o teclado do celular colocaria a
          primeira letra do e-mail da chave Pix em maiúscula, e a chave seria recusada.
          O inputmode (teclado de números ou de letras) e a dica mudam com o documento.
        -->
        <label for="valor">Número ou chave</label>
        <input
          id="valor"
          name="valor"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          maxlength="100"
          aria-describedby="dica"
          required
        />
        <p id="dica" class="dica">11 dígitos, com ou sem pontos e hífen.</p>

        <div class="acoes">
          <button type="submit" id="validar">Validar</button>
          <button type="button" id="exemplo" class="secundario">Usar um exemplo</button>
        </div>
      </form>

      <section id="resultado" aria-live="polite"></section>
    </main>

    <footer>
      <p>
        Código aberto no
        <a href="https://github.com/PedroPedrassolli/br_validators">GitHub</a>. Feito por
        <a href="https://pedrassolli.vercel.app">Pedro Pedrassolli</a>. Os exemplos são fictícios.
      </p>
    </footer>
  </body>
</html>
