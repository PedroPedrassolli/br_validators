# Publica a gem no RubyGems. Dois jeitos de disparar:
#   - botão "Run workflow" na aba Actions, com a main selecionada: o próprio
#     workflow cria a tag vX.Y.Z da versão atual e publica;
#   - criar e enviar a tag vX.Y.Z na main (git tag v0.2.0 && git push origin v0.2.0).
#
# Usa o "trusted publishing" do RubyGems: o RubyGems confia neste workflow
# (pelo token OIDC que o GitHub gera na hora), então nenhum token de API fica
# guardado nos secrets do repositório.
# Configuração no RubyGems: repositório PedroPedrassolli/br_validators,
# workflow release.yml, environment "release".
#
# Este job pode publicar a gem, então as Actions ficam fixadas pelo commit (SHA):
# ninguém consegue trocar o código delas mudando uma tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Duas publicações ao mesmo tempo brigariam pela mesma tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publicar no RubyGems
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write # o RubyGems confere que o pedido vem deste workflow
      contents: write # o rake release cria e envia a tag da versão
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Evita publicar a versão errada.
      #   Pelo botão: só a partir da main, e a versão ainda não pode ter sido
      #   publicada (a tag vX.Y.Z não pode existir).
      #   Pela tag: a tag v0.1.0 só passa se a gem for 0.1.0, e o commit da tag
      #   precisa estar na main (não dá para publicar uma branch qualquer).
      - name: Conferir a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(ruby -Ilib -rbr_validators/version -e 'print BrValidators::VERSION')

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error title=Branch::Publique a partir da main (a branch escolhida foi $GITHUB_REF_NAME)."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error title=Versão::A versão $version já foi publicada. Suba a versão em lib/br_validators/version.rb num PR antes."
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error title=Versão::A tag $GITHUB_REF_NAME não bate com a versão da gem ($version)."
              exit 1
            fi
            # "identical" ou "behind": o commit da tag é a main ou já faz parte dela.
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
            if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
              echo "::error title=Branch::O commit da tag (${GITHUB_SHA:0:7}) não está na main."
              exit 1
            fi
          fi

          echo "::notice title=Versão::Publicando a versão $version."

      - name: Testes
        run: bundle exec rake test

      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
